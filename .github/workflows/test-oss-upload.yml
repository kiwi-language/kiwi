name: Test OSS Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    name: Test Aliyun OSS Upload
    runs-on: ubuntu-latest
    steps:
      - name: Create dummy artifacts
        run: |
          echo "dummy-macos-aarch64" > manul-macos-aarch64.tar.gz
          echo "dummy-linux-amd64" > manul-linux-amd64.tar.gz
          ls -la manul-*

      - name: Install ossutil
        run: curl -sL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Verify ossutil
        run: ossutil version

      - name: Upload to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          TAG_NAME="test"
          echo "Uploading release $TAG_NAME to Aliyun OSS..."

          OSS_BUCKET="manul-packages"
          OSS_ENDPOINT="https://oss-cn-hongkong.aliyuncs.com"

          for file in manul-*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              ossutil cp "$file" \
                "oss://$OSS_BUCKET/releases/$TAG_NAME/$file" \
                --endpoint "$OSS_ENDPOINT" \
                --force
            fi
          done

          echo "Done. Listing uploaded files:"
          ossutil ls "oss://$OSS_BUCKET/releases/$TAG_NAME/" \
            --endpoint "$OSS_ENDPOINT"
