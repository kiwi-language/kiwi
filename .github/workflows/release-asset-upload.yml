name: Upload Release Asset

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: manul-linux-amd64.tar.gz
          - os: macos-latest
            asset_name: manul-macos-aarch64.tar.gz
          - os: windows-latest
            asset_name: manul-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Image with Maven
        # Maven will now generate BOTH .zip and .tar.gz in the target folder
        run: mvn -B -Pnative package --file pom.xml

      - name: Rename Release Asset
        shell: bash
        run: |
          # Detect the extension we want based on the matrix asset_name
          if [[ "${{ matrix.asset_name }}" == *.zip ]]; then
            EXTENSION="zip"
          else
            EXTENSION="tar.gz"
          fi
          
          echo "Looking for built artifact with extension: .$EXTENSION"
          
          # Find the generated file in target/ (ignoring version numbers in the filename)
          # Finds: target/manul-*.zip or target/manul-*.tar.gz
          SOURCE_FILE=$(find ./target -name "*.$EXTENSION" -type f | head -n 1)

          if [ -z "$SOURCE_FILE" ]; then
            echo "Error: Could not find a .$EXTENSION file in ./target"
            ls -R ./target
            exit 1
          fi

          echo "Found artifact: $SOURCE_FILE"
          echo "Renaming to: ${{ matrix.asset_name }}"
          
          mv "$SOURCE_FILE" ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}