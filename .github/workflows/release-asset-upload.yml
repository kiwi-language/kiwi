name: Upload Release Asset

on:
  release:
    types: [created]
  workflow_dispatch:
  push:
    branches:
      - 'working'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Mac and Windows Builds
  # ------------------------------------------------------------------
  build-mac-win:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset_name: manul-macos-aarch64.tar.gz

          - os: macos-15-intel
            asset_name: manul-macos-amd64.tar.gz

          - os: windows-2022
            asset_name: manul-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build Native Image with Maven
        shell: bash
        run: |
          mvn -B -Pnative package -DskipTests

      - name: Rename Release Asset
        shell: bash
        run: |
          if [[ "${{ matrix.asset_name }}" == *.zip ]]; then
            EXTENSION="zip"
          else
            EXTENSION="tar.gz"
          fi

          SOURCE_FILE=$(find ./dist/target -name "*.$EXTENSION" -type f | head -n 1)
          if [ -z "$SOURCE_FILE" ]; then
            echo "Error: Could not find a .$EXTENSION file in ./dist/target"
            exit 1
          fi
          mv "$SOURCE_FILE" ${{ matrix.asset_name }}

      - name: Upload Release Asset to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}

      - name: Upload Release Asset to Tmp
        if: github.event_name != 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the 'tmp' release exists using GH CLI
          if gh release view tmp > /dev/null 2>&1; then
            echo "Uploading artifact to release 'tmp'..."
            # --clobber overwrites the file if it exists
            gh release upload tmp ${{ matrix.asset_name }} --clobber
          else
            echo "Release 'tmp' does not exist. Skipping upload."
          fi

      - name: Save Artifact for OSS Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ------------------------------------------------------------------
  # JOB 2: Linux Build
  # ------------------------------------------------------------------
  build-linux:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset_name: manul-linux-amd64.tar.gz
            image: ghcr.io/graalvm/native-image-community:21-ol8
            profiles: native
            alpine_zlib: false

          - os: ubuntu-22.04-arm
            asset_name: manul-linux-aarch64.tar.gz
            image: ghcr.io/graalvm/native-image-community:21-ol8
            profiles: native
            alpine_zlib: false

          - os: ubuntu-22.04
            asset_name: manul-alpine-amd64.tar.gz
            image: ghcr.io/graalvm/native-image-community:21-muslib
            profiles: native,static-musl
            alpine_zlib: false

          - os: ubuntu-22.04-arm
            asset_name: manul-alpine-aarch64.tar.gz
            image: bellsoft/liberica-native-image-kit-container:jdk-21-nik-23-musl
            profiles: native,static-musl,no-pie
            alpine_zlib: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Maven on Host
        run: |
          echo "Downloading Maven on Host..."
          wget -q https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
          tar xzf apache-maven-3.9.9-bin.tar.gz

      - name: Create Build Script
        run: |
          cat << 'EOF' > build.sh
          #!/bin/sh
          set -e
          EOF

          if [[ "${{ matrix.alpine_zlib }}" == "true"  ]]; then
            cat << 'EOF' >> build.sh
          echo ">>> Installing Compiler Dependencies..."
          apk update
          apk add zlib-static

          EOF
          fi

          cat << 'EOF' >> build.sh
          echo ">>> Building Native Image..."
          # Run the Maven we mounted from the host
          ./apache-maven-3.9.9/bin/mvn -B -P${{ matrix.profiles }} package -DskipTests

          echo ">>> Fixing file permissions..."
          chown -R $HOST_UID:$HOST_GID .
          EOF

          chmod +x build.sh

      - name: Run Build in Docker
        run: |
          docker run --rm \
            --entrypoint /bin/sh \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e HOST_UID=$(id -u) \
            -e HOST_GID=$(id -g) \
            ${{ matrix.image }} \
            /workspace/build.sh

      - name: Rename Asset
        run: |
          TARGET_DIR="./dist/target"
          if [ ! -d "$TARGET_DIR" ]; then
             echo "FATAL: Directory $TARGET_DIR does not exist."
             exit 1
          fi

          SOURCE_FILE=$(find "$TARGET_DIR" -maxdepth 1 -name "*.tar.gz" -type f | head -n 1)

          if [ -z "$SOURCE_FILE" ]; then
             echo "FATAL: No .tar.gz file found in $TARGET_DIR"
             ls -la "$TARGET_DIR"
             exit 1
          fi

          echo "Found artifact: $SOURCE_FILE"
          mv "$SOURCE_FILE" ${{ matrix.asset_name }}

      - name: Upload Release Asset to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}

      - name: Upload Release Asset to Tmp (Non-Release)
        if: github.event_name != 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view tmp > /dev/null 2>&1; then
            echo "Uploading artifact to release 'tmp'..."
            gh release upload tmp ${{ matrix.asset_name }} --clobber
          else
            echo "Release 'tmp' does not exist. Skipping upload."
          fi

      - name: Save Artifact for OSS Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  # ------------------------------------------------------------------
  # JOB 3: Upload to Aliyun OSS
  # ------------------------------------------------------------------
  aliyun-oss-upload:
    name: Upload to Aliyun OSS
    needs: [build-mac-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install ossutil
        run: curl -sL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload to OSS
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Uploading release $TAG_NAME to Aliyun OSS..."

          OSS_BUCKET="manul-packages"
          OSS_ENDPOINT="https://oss-cn-hongkong.aliyuncs.com"

          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" \
            -L CH

          for file in manul-*; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              ossutil cp "$file" "oss://$OSS_BUCKET/releases/$TAG_NAME/$file" -f
              ossutil cp "$file" "oss://$OSS_BUCKET/releases/latest/$file" -f
            fi
          done

          echo "All artifacts uploaded to OSS"
          echo "Download URL: https://pkg.metavm.tech/releases/$TAG_NAME/"
          echo "Latest URL: https://pkg.metavm.tech/releases/latest/"
